# ---------------------------------------------------------------------------
# Faculty Emails Extractor - configuration
# Paths are relative to the project folder.
# ---------------------------------------------------------------------------

paths:
  input_file: "input/CTEP Freelance Project Institutions File.xlsx"
  input_sheet: null                 # null = first sheet
  db_file: "output/cache.sqlite"    # page cache + results of every module (delete to start from scratch)
  log_dir: "output/logs"
  m1_output: "output/01_websites.xlsx"
  m2_output: "output/02_programs.xlsx"
  m3_output: "output/03_final.xlsx"

output:
  email_separator: "; "
  trailing_separator: true          # "a@x.edu; b@x.edu;" - client asked for a semicolon after each email
  degree_separator: "; "

browser:
  headless: false                   # keep false: a visible Chrome gets far fewer CAPTCHAs
  profile_dir: "output/chrome_profile"
  chrome_version_main: null         # e.g. 129 if undetected-chromedriver downloads the wrong driver version
  chrome_binary: null               # full path to chrome.exe if Chrome is not in the default location
  page_load_timeout: 45
  render_wait_seconds: 3
  max_load_more_clicks: 30
  max_scrolls: 15
  # Bot checks on websites (Cloudflare "Verify you are human", reCAPTCHA, hCaptcha):
  challenge_solve_seconds: 45       # time to get past one: wait, then click the checkbox (re-clicked every ~12 s)
  challenge_mouse_click: true       # Cloudflare: click the checkbox with the real mouse (the cursor moves for ~1 s)
  challenge_retries: 1              # not passed -> close Chrome, wait, open the same URL again (this many times)
  challenge_cooldown_minutes: [2, 4]  # random wait before trying again
  # still blocked after that -> the site is skipped for the rest of the run, with a note in the output

search:
  backend: auto                     # auto = Serper API when SERPER_API_KEY is set, otherwise Chrome; or: serper / chrome
  serper_api_keys: []               # better in .env: SERPER_API_KEYS=key1,key2,... (used one by one; next key when one runs out)
  chrome_fallback: true             # if the API fails (no credits, outage), search in Chrome instead
  gl: us
  hl: en
  num: 10                           # results per search (10 = 1 credit)
  timeout: 30

google:                             # Chrome searches only
  home_url: "https://www.google.com/?hl=en&gl=us"
  search_url: "https://www.google.com/search?hl=en&gl=us&q="
  min_delay_seconds: 8
  max_delay_seconds: 20
  long_break_every: 25              # take a longer pause after this many searches
  long_break_seconds: [60, 120]
  captcha_wait_seconds: 900         # how long to wait for you to solve a CAPTCHA in the Chrome window
  auto_click_captcha: true          # click the "I'm not a robot" checkbox automatically; beep only if an image challenge appears

fetch:
  timeout: 25
  connect_timeout: 10
  per_host_delay: 1.0               # seconds between two requests to the same website
  retries: 1
  max_bytes: 15000000
  browser_fallback: true            # open the page in Chrome when plain HTTP is blocked or needs JavaScript
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"

scorecard:
  enabled: true
  api_key: ""                       # or SCORECARD_API_KEY in .env (free: https://api.data.gov/signup/)
  ipeds_hd_csv: null                # alternative without a key: IPEDS "HD" directory CSV (UNITID, WEBADDR columns)

# ---------------------------------------------------------------------------
# Module 1 - official website
# ---------------------------------------------------------------------------
m1:
  query_template: '"{name}" {city} {state} official website'
  top_results: 5
  other_links_max: 8                # distinct sites taken from AI Overview / other links on the results page
  title_match_threshold: 85         # institution name vs Google result title (fuzzy, 0-100)
  high_threshold: 75                # e.g. top result + .edu + name in title + domain looks like the name
  medium_threshold: 45
  ambiguity_margin: 10              # runner-up this close to the winner -> at most Medium
  weights:
    knowledge_panel: 40
    edu: 25
    scorecard: 30
    scorecard_partial: 15
    domain_name_match: 15
    title_match: 25
    rank1: 10
    third_party: -100
    campus_mismatch: -30
  generic_subdomains: [admissions, admission, apply, catalog, catalogs, catalogue, bulletin, news, library, lib,
                       libguides, my, portal, online, give, giving, alumni, athletics, go, info, visit, events,
                       calendar, directory, web, www2, ww2, home, students, sites, blogs, blog, today, magazine,
                       careers, jobs, hr, it, help, support, shop, store, bookstore, en, m, mobile]
  third_party_domains: [wikipedia.org, usnews.com, niche.com, collegeboard.org, petersons.com, cappex.com,
                        collegeraptor.com, unigo.com, princetonreview.com, forbes.com, collegesimply.com,
                        collegevine.com, facebook.com, instagram.com, linkedin.com, twitter.com, x.com, youtube.com,
                        tiktok.com, yelp.com, mapquest.com, indeed.com, glassdoor.com, ed.gov, collegetuitioncompare.com,
                        univstats.com, collegefactual.com, universityhq.org, bestcolleges.com, thebestschools.org,
                        collegedata.com, zippia.com, britannica.com, crunchbase.com, bloomberg.com, reddit.com,
                        quora.com, google.com, bing.com, yahoo.com, collegeconfidential.com, topuniversities.com,
                        timeshighereducation.com, 4icu.org, gradreports.com, payscale.com, schooldigger.com,
                        stateuniversity.com, usnews.org, collegeaffordabilityguide.org, onlineu.com]

# ---------------------------------------------------------------------------
# Module 2 - undergraduate programs page
# ---------------------------------------------------------------------------
m2:
  workers: 4
  second_hop_top_n: 3
  second_hop_penalty: -5
  validate_top_n: 6
  use_sitemap: true
  sitemap_max_files: 8
  sitemap_max_urls: 30000
  sitemap_top_n: 5
  catalog_subdomains: [catalog, catalogue, bulletin]
  catalog_base_score: 15
  catalog_link_bonus: 5
  catalog_vendor_domains: [smartcatalogiq.com, acalogadmin.com, coursedog.com, courseleaf.com]
  # Step 1 - Google ({site} = campus host like d.umn.edu, or the whole domain). The 2nd query runs only if the 1st is not High.
  google_queries:
    - 'site:{site} undergraduate majors programs'
    - 'site:{site} "majors" OR "programs of study" OR "areas of study" bachelor'
  google_top_results: 6
  google_validate_top_n: 3          # results opened and checked for degree listings
  google_min_score: 10              # floor for a result whose title has no keyword
  google_rank_bonus: [15, 10, 6, 3] # points for Google rank 1, 2, 3, 4
  google_render_top_n: 2            # open Google's top N results in Chrome if the plain HTML lists no degrees (JS finders)
  # Step 2 - academics page (only if still not High): Column D fallback + a hub whose links are checked
  academics_query: 'site:{site} academics'
  academics_keywords:
    "academics": 30
    "academic programs": 30
    "academic departments": 25
    "schools and colleges": 25
    "colleges and schools": 25
    "departments": 15
    "graduate": -30
    "online": -15
    "news": -40
    "event": -40
    "events": -40
    "calendar": -30
    "athletics": -40
    "policy": -20
    "policies": -20
    "integrity": -30
    "catalog": -10
  # Step 3 - crawl (homepage menus, catalog sub-site, sitemap) only if still not High. --google-only skips it.
  catalog_tie_margin: 10
  host_penalties: {online: -40, distance: -30, elearning: -30}   # sub-site words: onlinedegrees.x.edu lists online programs only
  dept_path_penalty: -15            # /school-of-.../ or /...-department/: one department's page, not the full list            # prefer the website's own majors page over a catalog page within this many points
  render_if_markers_below: 5
  high_threshold: 80
  medium_threshold: 50
  agreement_bonus: 15
  marker_bonus: [[15, 30], [5, 20], [1, 5], [0, -20]]    # [min "Bachelor/B.S./Major" mentions, points]
  target_bonus: [[5, 25], [3, 15], [1, 5], [0, -10]]     # [min distinct target majors linked, points]
  url_factor: 0.5
  # Scored on link text (full weight) and URL path (x url_factor). Best positive + all negatives.
  link_keywords:
    "undergraduate programs": 40
    "undergraduate majors": 40
    "undergraduate degrees": 40
    "majors and minors": 35
    "majors minors": 35
    "programs of study": 35
    "areas of study": 30
    "fields of study": 30
    "academic programs": 30
    "degree programs": 30
    "degrees and programs": 30
    "programs and degrees": 30
    "find your program": 30
    "find your major": 30
    "explore programs": 25
    "explore majors": 25
    "all programs": 25
    "programs a z": 25
    "majors": 25
    "undergraduate": 15
    "programs": 10
    "degrees": 10
    "academics": 8
    "graduate": -30
    "online": -20
    "continuing": -30
    "adult": -20
    "professional studies": -15
    "certificate": -15
    "news": -40
    "event": -40
    "events": -40
    "blog": -40
    "story": -30
    "admission requirements": -20
    "apply": -15
