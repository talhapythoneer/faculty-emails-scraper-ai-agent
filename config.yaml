# ---------------------------------------------------------------------------
# Which majors count (Module 2 validation + Module 3 Column E)
# ---------------------------------------------------------------------------
majors:
  # Auto-included when a program name contains one of these (whole words).
  target_keywords:
    # life sciences
    - biology
    - biological science
    - biological sciences
    - life science
    - life sciences
    - biochemistry
    - microbiology
    - molecular biology
    - cell biology
    - cellular biology
    - neurobiology
    - genetics
    - ecology
    - zoology
    - botany
    - physiology
    - biotechnology
    - bioinformatics
    - biomedical
    - biomedical science
    - biomedical sciences
    - marine biology
    - marine science
    - neuroscience
    - neurosciences
    - cognitive science
    # physical sciences
    - chemistry
    - physics
    - biophysics
    - astronomy
    - astrophysics
    - geology
    - earth science
    - environmental science
    - natural science
    - natural sciences
    - physical science
    - forensic science
    # formal sciences / computing
    - statistics
    - mathematics
    - applied mathematics
    - data science
    - data sciences
    - data analytics
    - computer science
    - computer sciences
    # engineering
    - engineering
    - bioengineering
    # health
    - nursing
    - public health
    - community health
    - global health
    - health science
    - health sciences
    - health studies
    - health policy
    - exercise
    - exercise science
    - exercise physiology
    - kinesiology
    - athletic training
    - nutrition
    - dietetics
    - medical laboratory
    - clinical laboratory
    - medical technology
    - radiologic
    - radiography
    - sonography
    - respiratory
    - nuclear medicine
    - pharmaceutical
    - allied health
    - speech language
    - audiology
    - communication sciences
    - communication disorders
    # social / applied
    - psychology
    - psychological science
    - communication
    - communications
    - political science
    - sociology
    - social work
    - equine science
    - equine studies
    - sport management
  # Names containing these (prefix match) but no target keyword go to the AI, or to the Programs sheet for review.
  ambiguous_keywords: [science, health, medical, medicine, bio, chem, clinical, therap, wellness, sport,
                       rehabilitation, environment, sociology, anthropology, behavior, gerontology, social work,
                       pharmacy, informatics, analytics, computing, technology, cyber, veterinary, agricult, food,
                       animal, plant, math, human performance, human development, fitness, physical education]
  # Regex on the lowercase program name. Any match = not a bachelor's major.
  exclude_patterns:
    - '\bminors?\b'
    - '\bcertificat'
    - '\bassociate\b'
    - '\bmaster'
    - '(?<![a-z])m\.\s?s\.?(?![a-z])'
    - '(?<![a-z])m\.\s?a\.?(?![a-z])'
    - '\b(ms|ma|mba|mph|msn)\b'
    - '\bph\.?\s?d\b'
    - '\bdoctor'
    - '\b(dnp|dpt|otd|pharm\.?\s?d)\b'
    - '\bgraduate\b'
    - '\bpost-?\s?bacc'
    - '\bpre-?\s?(med|medical|medicine|dental|dentistry|vet|veterinary|pharmacy|physical therapy|occupational therapy|pt|ot|optometry|physician|health|professional|law|nursing|engineering|physician assistant)\b'
    - '\bcourses?\b'
    - '\b(club|society|association)\b'
    - '\bgrades?\s*[pk0-9]+\s*[-–]\s*[0-9]+'   # teacher-certification tracks ("Biology Grades 8-12")
    - '\bteach(ing|er|ers)?\b'
    - '\beducation\b'
    - '\b(aas|asn|adn|a\.a\.s|a\.s\.n|a\.d\.n)\b'   # associate degrees written as abbreviations
    - '\bgradute\b'                                  # misspelled "graduate" on some program finders
    - '\blicensure\s+only\b'                         # teacher licensure, not a degree
    - '^\s*[a-z]{2,4}\s?-?\d{3,4}[a-z]?\b'            # a course, not a major ("BI 101 Introduction to Biology")
    - '^\s*(school|college|department|division|institute) of\b'   # a school, not a major
  # Regex on the lowercase name: navigation / non-program links.
  noise_patterns:
    - '^(apply|apply now|visit|visit campus|request info(rmation)?|give|donate|news|events|contact( us)?|login|log in|search|menu|home|faculty|staff|directory|about|about us)$'
    - '\b(scholarships?|internships?|news|events?|tutoring|outreach|newsletter|calendar|symposium|seminar|lecture series|awards?|alumni|hiring|jobs?|careers? in|summer program|high school|k-12|research lab|facilities|student organizations?|living learning|honors college)\b'
    - '\b(health services|health center|counseling|wellness center|student health|health insurance|immuni[sz]ation|covid)\b'
  min_name_length: 3
  max_name_length: 90

# ---------------------------------------------------------------------------
# Contact roles (checked in this order; first match wins)
# ---------------------------------------------------------------------------
roles:
  patterns:
    emeritus: '\bemerit(us|a|i)\b'
    chair: '\b(chair|chairperson|chairwoman|chairman|department head|head of (the )?department|head,? department of)\b'
    dean: '\bdean\b'
    program_director: '\b(director|program head|program lead)\b'
    coordinator: '\b(coordinator|advis[eo]r)\b'
    professor: '\b(professor|lecturer|instructor|faculty)\b'
    staff: '\b(assistant|administrator|manager|specialist|secretary|technician|staff)\b'
  ignore_phrases: ['endowed chair', 'named chair', 'chair(ed)? professor(ship)?', 'faculty senate', 'board of trustees']
  staff_phrases: ['(administrative|executive|office|department(al)?) (assistant|associate|manager|specialist|secretary)',
                  'assistant to the']
  selection_priority: [chair, program_director, dean, coordinator, office, professor, staff, unknown, emeritus]
  # An email with no person name whose local part contains one of these is treated as an office mailbox.
  office_email_keywords: [advis, career, research, undergrad, ugrad, urop, dept, department, office, studies,
                          program, science, biology, chem, physics, psych, nursing, health, kinesiology, neuro,
                          engineering, stats, math, comm, success, academic]

emails:
  # Local parts (before @) that are never used.
  generic_local_parts: [noreply, no-reply, donotreply, do-not-reply, webmaster, web, website, info, information,
                        admission, admissions, apply, hr, humanresources, jobs, employment, help, helpdesk,
                        servicedesk, support, it, ithelp, security, police, publicsafety, titleix, privacy,
                        accessibility, registrar, bursar, financialaid, finaid, marketing, communications, news,
                        media, press, alumni, giving, development, foundation, athletics, library, events, webteam, webservices,
                        bookstore, housing, dining, parking, postmaster, abuse, president, provost, purchasing,
                        payroll, accounts, billing]
  generic_local_prefixes: [noreply, no-reply, donotreply, webmaster, admission, alumni, giving, athletic]

# ---------------------------------------------------------------------------
# AI (Module 3 only)
# ---------------------------------------------------------------------------
llm:
  enabled: true                     # without the provider's key in .env, AI steps are skipped (rules only)
  provider: groq                    # groq (GROQ_API_KEY, paid Developer account) or anthropic (ANTHROPIC_API_KEY)
  # Groq, tried in order: gpt-oss-120b does everything; gpt-oss-20b only takes over if 120b hits a rate limit.
  # Both are production models with strict JSON-schema output (answers always match the expected format).
  models: ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]
  # How long the model thinks before answering, per task (low / medium / high):
  reasoning_effort:
    default: medium                 # judging program names, picking a faculty link
    extract_programs: high          # reading a whole programs page: most room for mistakes, runs rarely
    extract_contacts: low           # copying name / title from the text around an email: mechanical, most calls
  model: "claude-haiku-4-5"         # used when provider = anthropic
  max_tokens: 8192                  # room for the model's thinking + the JSON answer
  max_prompt_chars: 60000           # ~15K tokens per request (the paid tier has no 8K tokens-per-minute cap)
  max_wait_seconds: 90              # wait this long on "too many requests"; longer = daily limit -> next model
  max_retries: 4
  timeout: 120
  price_input_per_mtok: 0.15        # used by `python run.py cost` (gpt-oss-120b on Groq; Claude Haiku 4.5 = 1.0 / 5.0)
  price_output_per_mtok: 0.60
  criteria: |
    The client wants undergraduate bachelor's degree MAJORS in natural sciences (life and physical sciences),
    health sciences, and social, formal and applied/interdisciplinary sciences. Examples: Biochemistry, Biology,
    Biomedical Sciences, Chemistry, Communication, Computer Science, Data Science, Engineering (Biomedical,
    Chemical, Mechanical), Exercise Science, Health Policy, Health Science, Kinesiology, Neuroscience, Nursing,
    Marine Biology/Science, Molecular Biology, Physics, Psychology, Public Health, Statistics.
    Also wanted: Political Science, Sociology, Social Work, Equine Science, Sport Management.
    Health-related programs are the top priority.
    Not wanted: arts, humanities, business, education, minors, certificates, associate degrees,
    graduate-only programs, pre-professional tracks, teacher-education tracks.
