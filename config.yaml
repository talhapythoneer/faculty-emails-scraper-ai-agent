# ---------------------------------------------------------------------------
# Module 3 - degrees, faculty pages, contacts
# ---------------------------------------------------------------------------
m3:
  workers: 4
  max_listing_pages: 15             # pagination pages followed on the programs page
  render_if_programs_below: 3       # render the programs page in Chrome if fewer candidates are found
  max_ambiguous_for_llm: 80
  llm_text_fallback_below: 2        # AI reads the page text if rules found fewer majors than this
  llm_text_max_chars: 24000         # page text sent to the AI when rules find too few majors
  llm_text_max_links: 200
  max_programs_for_contacts: 60
  max_requests_per_institution: 300
  max_directory_pages: 10
  max_profiles_per_directory: 10
  render_if_no_emails: true
  faculty_link_threshold: 20
  max_faculty_page_tries: 5        # faculty-page sources tried per major until one gives a useful email
  wide_page_emails: 60              # a "faculty page" with more emails is a campus directory: keep only people naming the dept
  faculty_url_reject: ["/news", "/blog", "/article", "/story", "/stories", "/event", "/calendar", "/magazine",
                       "/press", "/podcast", "/alumni", "/jobs", "/careers", "/employment", "/postings",
                       "/human-resources", "/hr/"]   # never used as faculty pages
  faculty_host_reject: ["athletics.", "gosports.", "alumni.", "news.", "give.", "giving.", "shop.", "store."]
  # never selected (Column F): admissions, graduate-program, study-abroad and registrar staff
  exclude_title_patterns: ['\benroll', '\badmission', '\brecruit', '\bgraduate\s+(program\s+)?(coordinator|director|admissions?|studies)',
                           '\b(study|education)\s+abroad', '\bfinancial\s+aid', '\bregistrar', '\bbursar', '\balumni',
                           '\badvancement', '\bstudent\s+accounts', '\btech(nology)?\s+support\b', '\bhelp\s*desk\b',
                           '\bdean\s+of\s+(men|women|students|student\s+life)\b', '\bhousing\b', '\bresidence\s+life\b',
                           '\bphysical\s+plant\b', '\bfacilit(y|ies)\b', '\b(it|information\s+technology)\s+(services|systems|support)\b',
                           '\bcomputing\s+systems\b', '\bsystems\s+administrator\b', '\bdirector\s+of\s+\w+\s+at\s+[A-Z]',
                           '\badvisory\s+board\b', '\bstudent\s+success\b', '\binstitutional\s+research\b',
                           '\bathletics?\s+communications?\b', '\bsuccess\s+coach', '\bbusiness\s+analyst\b',
                           '\bsports?\s+information\b', '\bevent(s)?\s+(coordinator|manager)\b']
  # links under these paths are never majors (student-life pages linked from the programs page)
  program_url_reject: ["/student-life", "/campus-life", "/athletics", "/news", "/events"]
  dept_link_threshold: 25
  llm_max_links: 120                # links offered to the AI when picking a faculty page
  google_per_institution_api: 30       # Google searches per institution for department faculty pages (Serper API)
  google_fallback_per_institution: 2   # same, when searching through Chrome
  google_query: 'site:{site} "{program}" faculty'
  fallback_professors_per_program: 3   # when no chair/director/dean/coordinator is found
  max_office_emails_per_program: 2
  max_emails_per_institution: 0        # 0 = no limit
  office_fallback_below: 2             # look for research/advising/career offices if fewer emails were selected
  office_max_pages: 4
  office_link_threshold: 25
  min_emails_for_extra_domain: 3       # accept a different .edu email domain (e.g. maine.edu) seen this often
  max_llm_contacts: 150
  llm_contacts_batch: 25            # email snippets per AI call
  max_card_chars: 700
  faculty_link_keywords:
    "faculty and staff": 40
    "faculty staff": 40
    "faculty directory": 40
    "meet the faculty": 40
    "meet our faculty": 40
    "our faculty": 35
    "faculty": 30
